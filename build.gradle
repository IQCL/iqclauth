plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://mirrors.zju.edu.cn/maven/" }
    mavenCentral()
}

dependencies {
    // Minecraft + Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 显式声明需要的 Fabric API 子模块
    modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:2.2.13+1802ada577"
    modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.2.22+1802ada577"
    modImplementation "net.fabricmc.fabric-api:fabric-events-interaction-v0:0.6.2+1802ada577"
    modImplementation "net.fabricmc.fabric-api:fabric-networking-api-v1:1.0.0+1802ada577"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// 强制使用 UTF-8 编码读取源文件（系统默认可能是 GBK，会导致中文注释编译失败）
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// —— fabric.mod.json 中 ${version} 由 processResources 替换 ——
